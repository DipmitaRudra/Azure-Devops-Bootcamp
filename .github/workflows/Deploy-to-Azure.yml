# GitHub Actions workflow for deploying to Azure
name: Deploy to Azure

# Trigger workflow when code is pushed to the dev branch
on:
  push:
    branches: [dev]

# Environment variables used throughout the workflow
env:
  AZURE_ENVIRONMENT: dev                   # Deployment environment (e.g., dev, test, prod)
  ACR_REPOSITORY: azuredevopsbootcampapp   # Name of the ACR repository where the app image is stored
  TFVARS_FILE: terraform/dev.tfvars        # Path to the Terraform variable file for environment-specific values
  IMAGE_TAG: ${{ github.sha }}             # Docker image tag, set to the commit SHA for traceability and rollback

jobs:
  Deploy:
    # Run on the latest Ubuntu runner
    runs-on: ubuntu-latest

    # Permissions required for GitHub OIDC authentication with Azure
    permissions:
      id-token: write   # Needed for federated identity login (OIDC)
      contents: read    # Allows reading repository contents

    steps:
      # Step 1: Checkout the repository code
      - name: Checkout Repository
        uses: actions/checkout@v7
        
      # Step 2: Authenticate to Azure using GitHub OIDC
      # This uses federated identity instead of storing secrets in the workflow
      - name: Azure Login
        uses: azure/login@v3
        with: 
          client-id: ${{ secrets.AZURE_CLIENT_ID }}               # OIDC app registration client ID
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}               # Azure AD tenant ID
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}   # Target Azure subscription
      
      # Step 3: Verify Azure CLI session after OIDC login
      # This proves the runner has an authenticated Azure session
      - name: Show Azure Account
        run: az account show

      # Step 4: Setup Terraform CLI
      # Installs the specified Terraform version on the runner
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.4   # Correct version format (no "v" prefix)

      # Step 5: Initialize Terraform
      # Runs 'terraform init' in the terraform directory to set up providers and modules
      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init
        
      # Step 6: Validate Terraform configuration
      # Ensures the Terraform files are syntactically valid and internally consistent
      - name: Terraform Validate
        working-directory: ./terraform
        run: terraform validate

      # Step 7: Terraform Plan
      # Creates and saves an execution plan using dev.tfvars, overrides the image tag, and disables interactive prompts
      - name: Terraform Plan
        working-directory: ./terraform
        run: terraform plan -var-file=${{ env.TFVARS_FILE }} -var="container_image_tag=${{ env.IMAGE_TAG }}" -out=tfplan -input=false



